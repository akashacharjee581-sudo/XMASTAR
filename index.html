.login-logo{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:3px;color:#00ff41;text-shadow:0 0 20px #00ff41,0 0 40px #00ff41;margin-bottom:6px;animation:glow 2s ease-in-out infinite alternate}

.login-input{width:100%;padding:14px;background:#010801;border:1.5px solid #1a5c1a;border-radius:10px;color:#00ff41;font-family:'Share Tech Mono',monospace;font-size:15px;letter-spacing:2px;text-align:center;outline:none;margin-bottom:14px;transition:all .25s}
.login-input:focus{border-color:#00ff41;box-shadow:0 0 15px rgba(0,255,65,.3)}
.login-input.err{border-color:#ff2222;animation:shake .4s ease}

.login-err{font-size:10px;color:#ff4444;letter-spacing:1px;margin-bottom:12px;display:none}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00ff41,#00b92d);border:1px solid #00ff41;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 0 20px rgba(0,255,65,.35)}
.login-btn:active{transform:translateY(1px)}
.login-foot{font-size:8px;color:#1a5c1a;letter-spacing:1px;margin-top:18px}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;flex-shrink:0;background:rgba(1,8,1,.97);border-bottom:1px solid #0d3d0d;position:relative;z-index:2}
.nav-logo{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;color:#00ff41;text-shadow:0 0 15px #00ff41;display:flex;align-items:center;gap:7px}
.nav-sub{font-size:6px;color:#1a5c1a;letter-spacing:2px;font-family:'Share Tech Mono',monospace}
.sdot{width:7px;height:7px;border-radius:50%;background:#00ff41;box-shadow:0 0 8px #00ff41;animation:lp 1.2s ease-in-out infinite;flex-shrink:0}

.nav-clock{font-size:10px;color:#39ff14;letter-spacing:1px}

/* SCROLL */

.sc::-webkit-scrollbar{width:3px}
.sc::-webkit-scrollbar-thumb{background:#0d3d0d;border-radius:2px}

/* TAB ROW (30s/1m) */

.tab.on{background:rgba(0,255,65,.1);border-color:#00ff41;color:#00ff41;box-shadow:0 0 14px rgba(0,255,65,.2)}

.game-card.dk .game-name{color:#a855f7}
.game-card.hg .game-name{color:#fbbf24}
.game-card.bd .game-name{color:#38bdf8}

.sts-r{font-size:9px;color:#1a5c1a;letter-spacing:1px}
